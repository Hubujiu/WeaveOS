name: v0.1.0 product acceptance
on:
  pull_request:
  workflow_dispatch:
    inputs:
      verify_release:
        description: Verify complete evidence after V010-008 user signoff
        type: boolean
        default: false
  workflow_call:
    inputs:
      verify_release:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  product:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: docker/setup-docker-action@e43656e248c0bd0647d3f5c195d116aacf6fcaf4
        with:
          version: v29.6.2
          daemon-config: |
            {"features":{"containerd-snapshotter":true}}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - name: Migrations, HTTPS and real product acceptance
        # postgres:18.0 and redis:8.2.1 in compose.json.
        # Runner executes playwright test tests/acceptance using its HTTPS config.
        run: node infra/acceptance/run.mjs
      - name: Runtime configuration, crypto, failure handling and dependency security
        run: node --test infra/runtime/config.test.mjs infra/runtime/backup-crypto.test.mjs infra/runtime/recovery.test.mjs infra/runtime/monitor.test.mjs infra/runtime/cli.test.mjs infra/runtime/security.test.mjs
      - name: Build once and verify immutable runtime, restore, rollback and browsers
        run: node infra/runtime/run.mjs
      - name: Complete check-release gate including user signoff
        if: inputs.verify_release == true
        run: node scripts/check-release.mjs
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: product-acceptance-${{ github.run_id }}
          path: .work/acceptance/public/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: runtime-evidence-${{ github.run_id }}
          path: .work/runtime/public/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: tested-oci-${{ github.sha }}
          path: .work/runtime/export/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
