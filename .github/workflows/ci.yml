      - name: Build pinned static Goose for isolated test containers
        run: CGO_ENABLED=0 go install github.com/pressly/goose/v3/cmd/goose@v3.28.0
      - name: Root real migration CLI and runtime-role acceptance
        run: |
          mkdir -p services/workflow-engine/schema-cli-reports
          WEAVEOS_SCHEMA_TEST_GOOSE="$(go env GOPATH)/bin/goose" bash services/workflow-engine/run-schema-cli-tests.sh 2>&1 | tee services/workflow-engine/schema-cli-reports/run.log
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
