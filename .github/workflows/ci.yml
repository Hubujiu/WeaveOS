  workflow-backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - name: Real isolated encrypted backup and restored CHECK behavior
        shell: bash
        run: |
          name="weaveos-v010-backup-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker run -d --name "$name" --network none \
            -e POSTGRES_USER=weaveos_owner -e POSTGRES_HOST_AUTH_METHOD=trust \
            postgres:18.6@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
          trap 'docker stop "$name" >/dev/null' EXIT
          ready=0
          for attempt in $(seq 1 60); do
            if docker exec "$name" sh -ec 'test "$(cat /proc/1/comm)" = postgres; psql -X -v ON_ERROR_STOP=1 -U weaveos_owner -d postgres -tAc "SELECT 1"' >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = 1
          WEAVEOS_BACKUP_TEST_CONTAINER="$name" WEAVEOS_BACKUP_TEST_USER=weaveos_owner \
            node --test infra/runtime/backup.test.mjs
