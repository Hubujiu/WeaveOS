name: Root Q36 native event diagnostic
on:
  push:
    branches: [task/V030-046-firefox-diagnostic]
permissions:
  contents: read
jobs:
  native-events:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - name: Locked dependencies
        run: |
          npm install --global pnpm@10.28.2 --ignore-scripts
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Type and production build
        run: |
          pnpm typecheck
          pnpm build
      - name: All unchanged Q36 regressions across three engines
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/root-q36-regression.json
        run: pnpm exec playwright test --config docs/evidence/V010-020/q36-b2/components.config.ts 'q36-front-|q36-b2' --workers=1 --reporter=list,json --output test-results/root-q36-regression
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: root-native-events
          path: test-results/
          retention-days: 14
          if-no-files-found: error
