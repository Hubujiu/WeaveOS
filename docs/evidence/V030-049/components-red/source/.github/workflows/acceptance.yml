name: v0.1.0 product acceptance
on:
  pull_request:
  workflow_dispatch:
    inputs:
      verify_release:
        description: Verify complete evidence after V010-008 user signoff
        type: boolean
        default: false
  workflow_call:
    inputs:
      verify_release:
        type: boolean
        default: false
concurrency:
  group: product-${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  preflight:
    uses: ./.github/workflows/preflight.yml
  product:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Prepare hosted Linux disk for browser images and vulnerability database
        shell: bash
        run: |
          test "$RUNNER_ENVIRONMENT" = "github-hosted"
          test "$RUNNER_OS" = "Linux"
          sudo rm -rf -- /usr/local/lib/android
          df -h /
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: docker/setup-docker-action@e43656e248c0bd0647d3f5c195d116aacf6fcaf4
        with:
          version: v29.6.2
          daemon-config: |
            {"features":{"containerd-snapshotter":true}}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - name: Migrations, HTTPS and real product acceptance
        # postgres:18.6@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722 and redis:8.2.10@sha256:164c759a0c342ee69d08fc99219382b0fd682181465c0df2e0e6911f4c85d73c in compose.json.
        # Runner executes playwright test tests/acceptance using its HTTPS config.
        run: node infra/acceptance/run.mjs
      - name: Runtime configuration, crypto, failure handling and dependency security
        run: node --test infra/runtime/rollback-security.test.mjs infra/runtime/artifacts.test.mjs infra/runtime/storage-version.test.mjs infra/runtime/config.test.mjs infra/runtime/backup-crypto.test.mjs infra/runtime/recovery.test.mjs infra/runtime/monitor.test.mjs infra/runtime/cli.test.mjs infra/runtime/advisory-review.test.mjs infra/runtime/security.test.mjs
      - name: Build once and verify immutable runtime, restore, rollback and browsers
        run: node infra/runtime/run.mjs
      - name: Automatic deployment migrations with isolated real PostgreSQL
        env:
          WEAVEOS_TEST_GOOSE: .work/runtime/tools/goose
        run: node --test infra/server/deploy/migrate.test.mjs infra/server/deploy/personnel-upgrade.test.mjs
      - name: Verify deployment packaging from the same accepted OCI artifacts
        run: node infra/server/deploy/package.mjs .work/runtime/export/BUILD.json .work/deployment
      - name: Complete check-release gate including user signoff
        if: inputs.verify_release == true
        run: node scripts/check-release.mjs
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: product-acceptance-${{ github.run_id }}
          path: .work/acceptance/public/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: runtime-evidence-${{ github.run_id }}
          path: .work/runtime/public/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: tested-oci-${{ github.sha }}
          path: .work/runtime/export/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
