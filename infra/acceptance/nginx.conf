# Generated by infra/runtime/nginx.mjs; edit the shared renderer.
events {}
# Request-bearing Nginx errors may contain credentials in query strings.
# Access status + request_id provide request diagnostics without raw error text.
error_log /dev/null;
http {
  include /etc/nginx/mime.types;
  log_format weaveos escape=json '{"at":"$time_iso8601","request_id":"$request_id","method":"$request_method","path":"$uri","status":$status,"bytes":$body_bytes_sent}';
  access_log /dev/stdout weaveos;
  server_tokens off;
  resolver 127.0.0.11 valid=1s ipv6=off;
  resolver_timeout 2s;
  proxy_connect_timeout 2s;
  proxy_read_timeout 5s;
  proxy_send_timeout 5s;
  proxy_hide_header X-Request-Id;
  proxy_hide_header X-Content-Type-Options;
  proxy_hide_header Cache-Control;
  upstream authentication {
    zone authentication 64k;
    server bff:8080 resolve;
  }
  server {
    listen 19443 ssl;
    server_name localhost;
    ssl_certificate /etc/nginx/tls/cert.pem;
    ssl_certificate_key /etc/nginx/tls/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /usr/share/nginx/html;
    add_header X-Request-Id $request_id always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "no-cache" always;
    location /api/ {
      proxy_pass http://authentication;
      proxy_set_header Host $http_host;
      proxy_set_header X-Request-Id $request_id;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-User-Id "";
      proxy_set_header X-Role "";
      proxy_set_header X-Tenant-Id "";
      proxy_cache off;
      add_header X-Request-Id $request_id always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Cache-Control "no-store" always;
    }
    location /health/ {
      proxy_pass http://authentication;
      proxy_set_header X-Request-Id $request_id;
      proxy_set_header X-Forwarded-For $remote_addr;
      add_header X-Request-Id $request_id always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Cache-Control "no-store" always;
    }
    location /assets/ {
      try_files $uri =404;
      add_header X-Request-Id $request_id always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location / { try_files $uri $uri/ /index.html; }
  }
}
